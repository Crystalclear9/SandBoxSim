# SandBoxSim 持续集成
#
# 构建与测试说明见 docs/development/build.md：
#   1. 三平台都能构建 —— 证明模拟内核没有平台相关依赖；
#   2. 全部测试通过；
#   3. **确定性校验**（同 seed 两跑摘要一致）—— 这是本项目最核心的承诺；
#   4. 100 天 headless 冒烟 —— 长跑不崩、不产生 NaN、不进入"静止均衡"；
#   5. 产出报告与快照作为 artifact，方便人工复核涌现行为。
#
# 平台差异说明（这一条曾经把 CI 打挂过）：
#   构建脚本早期把可执行名写死成 'dotnet.exe'、兜底 SDK 路径写死成 'C:\Users\...'，
#   于是 Linux/macOS runner 直接报 "Cannot find drive. A drive with the name 'C' does not exist."
#   现在所有平台差异都收敛在 tools/build-lib.ps1 的 Get-DotnetExeName / Get-DefaultSdkRoot /
#   Get-SystemDotnetRoots 三个函数里，脚本其余部分与平台无关。
#
#   为了控制 CI 时长，只在 ubuntu 上跑"确定性校验 + 长跑 + 多 seed 批量"这类耗时步骤，
#   三平台都跑"构建 + 全部测试"（这一对才真正验证跨平台一致性）。

name: ci

on:
  push:
    branches: [main, codex]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 先用通道 A 构建 + 跑全部测试（三平台都做）。
      # CI 上允许并行构建（GitHub 的 runner 不会拦截 MSBuild 用的命名管道）。
      # -ParallelBuild 在受限环境里必须关掉，见 tools/build-lib.ps1 的注释。
      - name: Documentation links and path casing
        shell: pwsh
        run: ./tools/check-docs.ps1

      - name: Build script regression tests
        shell: pwsh
        run: ./tools/test-build.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: External evaluation interface tests
        shell: pwsh
        run: |
          ./tools/test-godot-path.ps1
          python -m unittest discover -s tools -p test_evaluate.py
          python tools/evaluate.py describe

      - name: Agent self-edit and second-order improver regression
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_rsi_benchmark.py
          python -m unittest discover -s tools -p test_rsi_code.py
          python -m unittest discover -s tools -p test_rsi_stateful.py
          python tools/rsi_benchmark.py run benchmarks/rsi-meta-smoke.json --output runs/rsi-meta-ci
          python tools/rsi_benchmark.py verify runs/rsi-meta-ci
          python tools/rsi_benchmark.py run benchmarks/rsi-stateful-smoke.json --output runs/rsi-stateful-ci
          python tools/rsi_benchmark.py verify runs/rsi-stateful-ci
          python tools/rsi_benchmark.py report runs/rsi-stateful-ci --output runs/rsi-stateful-ci/report.html

      - name: Upload improver probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improver-probes-${{ matrix.os }}
          path: |
            runs/rsi-meta-ci
            runs/rsi-stateful-ci
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (channel A)
        shell: pwsh
        run: ./tools/build.ps1 -Mode build -Configuration $env:CONFIGURATION -Channel sdk -ParallelBuild

      - name: Online HTTP and efficiency evidence regression
        shell: pwsh
        run: |
          python -m unittest discover -s tools -p test_efficiency.py
          python tools/test_online_service.py --assembly "artifacts/$env:CONFIGURATION/SandBoxSim.Console.dll" --output runs/online-ci

      - name: Upload online efficiency regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-efficiency-${{ matrix.os }}
          path: runs/online-ci
          if-no-files-found: ignore
          retention-days: 7

      - name: Test (all, channel A)
        shell: pwsh
        run: ./tools/build.ps1 -Mode test -Configuration $env:CONFIGURATION -Channel sdk -ParallelBuild

      # 通道 B（Roslyn csc 直编）也必须在 CI 上验证：
      # 它是"机器上只有运行时、没有 SDK"时的降级路径，而且它最容易因为
      # 少了某个 MSBuild 提供的隐式行为而悄悄失效（例如 InternalsVisibleTo
      # 曾经写成 MSBuild 项，导致通道 A 绿、通道 B 红）。只在 ubuntu 上跑一次即可。
      - name: Test (all, channel B / csc fallback)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/build.ps1 -Mode test -Configuration $env:CONFIGURATION -Channel csc

      - name: Determinism check (same seed twice, with agents)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/build.ps1 -Mode digest -Seed 4242 -Ticks 43200 -Agents 30 -Configuration $env:CONFIGURATION -Channel sdk -ParallelBuild

      - name: Headless smoke run (100 days, 40 agents, no intervention)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/build.ps1 -Mode snapshot -Seed 839102 -Days 100 -Agents 40 -SnapshotDays 25 -OutDir runs/ci -Configuration $env:CONFIGURATION -Channel sdk -ParallelBuild

      - name: Multi-seed robustness (agents)
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./tools/build.ps1 -Mode batch -SeedRange 1..6 -Days 60 -Agents 20 -OutDir runs/ci -Configuration $env:CONFIGURATION -Channel sdk -ParallelBuild

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.os }}
          path: runs/ci
          if-no-files-found: warn
          retention-days: 14
